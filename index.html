<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b13" />
    <meta
      name="description"
      content="Mushroom Run — a tiny, hand-crafted Mario-style platformer for the browser. Built with Phaser 3."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M4 15c0-6 5-10 12-10s12 4 12 10H4Z' fill='%23ef476f'/%3E%3Ccircle cx='11' cy='11' r='2.4' fill='%23ffe8a3'/%3E%3Ccircle cx='21' cy='13' r='1.8' fill='%23ffe8a3'/%3E%3Cpath d='M10 15h12v7c0 2-2 4-6 4s-6-2-6-4v-7Z' fill='%23ffe8c2'/%3E%3Crect x='13' y='19' width='2' height='2' fill='%23231827'/%3E%3Crect x='18' y='19' width='2' height='2' fill='%23231827'/%3E%3C/svg%3E"
    />
    <title>Mushroom Run — a tiny platformer</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Mushroom Run home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M3 15.5C3 9.2 8.8 4 16 4s13 5.2 13 11.5H3Z" fill="#ef476f" />
              <path d="M3 15.5h26" stroke="#a92c4b" stroke-width="2" />
              <circle cx="10" cy="10.5" r="2.8" fill="#ffe8a3" />
              <circle cx="21" cy="12" r="2" fill="#ffe8a3" />
              <path d="M10.5 16h11v6.8c0 2.4-2.4 4.2-5.5 4.2s-5.5-1.8-5.5-4.2V16Z" fill="#ffe8c2" />
              <rect x="13" y="20" width="2" height="2.2" fill="#231827" />
              <rect x="18" y="20" width="2" height="2.2" fill="#231827" />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name">Mushroom Run</span>
            <span class="brand-tag">Phaser 3 · one tiny world</span>
          </span>
        </a>

        <div class="topbar-actions">
          <button class="chip" id="pause-button" type="button" aria-label="Pause game">
            <span class="pause-glyph" aria-hidden="true"><i></i><i></i></span>
            <span class="chip-label" id="pause-label">Pause</span>
          </button>
          <button class="chip" id="sound-button" type="button" aria-label="Mute sound" aria-pressed="false">
            <span class="sound-glyph" aria-hidden="true">
              <svg viewBox="0 0 16 16">
                <path d="M2 6h3l4-3v10L5 10H2V6Z" fill="currentColor" />
                <path class="sound-wave" d="M11 5.2c1.3 1.5 1.3 4.1 0 5.6M13 3.2c2.4 2.7 2.4 6.9 0 9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                <path class="sound-slash" d="m11 5 5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </span>
            <span class="chip-label" id="sound-label">Sound on</span>
          </button>
          <button class="icon-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" />
            </svg>
          </button>
        </div>
      </header>

      <main class="stage-wrap">
        <div class="stage" id="stage">
          <div id="game"></div>
          <div class="stage-glass" aria-hidden="true"></div>
          <div class="scanlines" aria-hidden="true"></div>

          <div class="loading" id="loading" role="status">
            <div class="loading-mushroom" aria-hidden="true">
              <span class="loading-cap"></span>
              <span class="loading-face"><i></i><i></i></span>
            </div>
            <p class="loading-title">Planting mushrooms…</p>
            <div class="loading-bar"><i></i></div>
            <p class="loading-note">Warming up the pixel engine</p>
          </div>

          <div class="touch-layer" id="touch-layer" aria-label="Touch controls">
            <button class="touch-button touch-pause" type="button" data-action="pause" aria-label="Pause game">
              <span aria-hidden="true">II</span>
            </button>
            <button class="touch-button touch-run" type="button" data-touch="run" aria-label="Hold to run">
              <span>B</span>
              <small>RUN</small>
            </button>
            <div class="touch-dpad">
              <button class="touch-button touch-arrow" type="button" data-touch="left" aria-label="Move left">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" /></svg>
              </button>
              <button class="touch-button touch-arrow" type="button" data-touch="right" aria-label="Move right">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" /></svg>
              </button>
            </div>
            <button class="touch-button touch-jump" type="button" data-touch="jump" aria-label="Jump">
              <span>A</span>
              <small>JUMP</small>
            </button>
          </div>
        </div>
        <p class="mobile-note"><span aria-hidden="true">↻</span> Rotate for a bigger view</p>
      </main>

      <footer class="footer">
        <div class="key-guide" aria-label="Keyboard controls">
          <span class="key-group"><kbd>←</kbd><kbd>→</kbd><span>Move</span></span>
          <span class="key-group"><kbd>Space</kbd><span>Jump</span></span>
          <span class="key-group"><kbd>Shift</kbd><span>Run</span></span>
          <span class="key-group"><kbd>P</kbd><span>Pause</span></span>
          <span class="key-group"><kbd>M</kbd><span>Mute</span></span>
        </div>
        <p class="footer-note">An original little platformer. Made with Phaser 3 + pnpm.</p>
      </footer>
    </div>

    <noscript>Mushroom Run needs JavaScript enabled to play.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
